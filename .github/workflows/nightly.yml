name: Nightly fuzz

# Tier-3 of the data-integrity plan (see specification/data-integrity-tests.md).
# Runs the libFuzzer harnesses in `fuzz/` for a bounded time, seeded from the
# committed corpus in `fuzz/seeds/`. This workflow only takes effect on the
# default branch (scheduled workflows run from `main`).
#
# A crash uploads its reproducer under `fuzz/artifacts/<target>/`; promote it to
# a permanent regression by copying it into `fuzz/seeds/<target>/` (it will then
# be replayed on stable by core/tests/fuzz_seed_corpus.rs) and, where it
# corresponds to a real invariant, adding a focused test in `security_*.rs`.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target fuzz time in seconds
        required: false
        default: "180"

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz_${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_package_read
          - fuzz_manifest_json
          - fuzz_extract_zip
          - fuzz_archive_path
          - fuzz_thumbnail
          - fuzz_import
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly Rust (rust-src for libFuzzer build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev cmake pkg-config
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Seed the run corpus (seeds are committed, corpus/ is gitignored)
        run: |
          mkdir -p "fuzz/corpus/${{ matrix.target }}"
          cp -n "fuzz/seeds/${{ matrix.target }}/." "fuzz/corpus/${{ matrix.target }}/" || true
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} "corpus/${{ matrix.target }}" \
            -max_total_time=${{ github.event.inputs.seconds || 180 }}
      - name: Upload crash reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
