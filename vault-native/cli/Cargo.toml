[package]
name = "librecrate"
version = "0.5.5"
edition = "2021"
license = "AGPL-3.0-only"
description = "LibreCrate CLI — encrypted vault management, document storage, full-text search, backup and restore with an interactive REPL"

[[bin]]
name = "librecrate"
path = "src/main.rs"

[dependencies]
vault-native = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
tempfile = "3"
toml = "0.8"
open = "5"
rusqlite = { version = "0.31", default-features = false, features = ["bundled-sqlcipher"] }
rustyline = "15"
shlex = "1"
rpassword = "7"
