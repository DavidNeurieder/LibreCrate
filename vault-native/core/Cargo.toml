[package]
name = "vault-native"
version = "0.5.3"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "LibreCrate vault core: encrypted backup format, SQLCipher DB, merge logic"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
system-fonts = ["mupdf/system-fonts"]

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
aes = "0.8"

rusqlite = { version = "0.31", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "1"
uniffi = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
tempfile = "3"
toml = "0.8"
mupdf = { version = "0.8", default-features = false, features = ["epub", "cbz", "base14-fonts", "bundled-fonts-sil"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
uniffi_bindgen = "0.28"
camino = "1"
rusqlite = "0.31"
