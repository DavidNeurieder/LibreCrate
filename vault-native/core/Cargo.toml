[package]
name = "vault-native"
version = "0.6.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "LibreCrate vault core: encrypted backup format, SQLCipher DB, merge logic"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = []
system-fonts = ["mupdf/system-fonts"]

[dependencies]
argon2 = "0.6"
aes-gcm = "0.11"
aes = "0.9"

rusqlite = { version = "0.40", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
thiserror = "2"
uniffi = "0.28"
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
tempfile = "3"
toml = "1"
mupdf = { version = "0.8", default-features = false, features = ["epub", "cbz", "base14-fonts", "bundled-fonts-sil"] }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
uniffi_bindgen = "0.28"
camino = "1.2"
rusqlite = "0.40"
zip = { version = "9", default-features = false, features = ["deflate"] }
hex = "0.4"
base64 = "0.23"

[[bench]]
name = "kdf"
harness = false
