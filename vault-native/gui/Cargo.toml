[package]
name = "librecrate-gui"
version = "0.5.2"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.80"
description = "LibreCrate desktop GUI — encrypted vault manager with document import, full-text search, collections, tags, and cross-platform backup/restore"

[[bin]]
name = "librecrate-gui"
path = "src/main.rs"

[dependencies]
vault-native = { path = "../core" }
iced = { version = "0.14", features = ["svg", "image", "tokio", "selector"] }
tokio = { version = "1", features = ["rt", "fs", "io-util"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
rfd = "0.15"
mime_guess2 = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
anyhow = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[dev-dependencies]
iced_test = "0.14"

