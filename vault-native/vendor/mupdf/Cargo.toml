[dependencies.bitflags]
version = "2.0.2"

[dependencies.mupdf-fonts-droid]
version = "0.8.0"
optional = true

[dependencies.mupdf-fonts-noto]
version = "0.8.0"
optional = true

[dependencies.mupdf-fonts-sil]
version = "0.8.0"
optional = true

[dependencies.mupdf-sys]
version = "0.8.0"
features = ["zerocopy"]
default-features = false

[dependencies.once_cell]
version = "1.3.1"

[dependencies.percent-encoding]
version = "2.3.1"

[dependencies.serde]
version = "1.0.201"
features = ["derive"]
optional = true

[dependencies.zerocopy]
version = "0.8.17"
features = ["derive"]

[dev-dependencies.crossbeam-utils]
version = "0.8.1"

[dev-dependencies.serde_json]
version = "1.0.117"

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies.font-kit]
version = "0.14.1"
optional = true

[lints.clippy]
multiple_unsafe_ops_per_block = "allow"
